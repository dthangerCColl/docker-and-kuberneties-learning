
services:
  my-app:
    image: ${DOCKER_REGISTRY}/my-app:1.0
    ports:
      - 3000:3000
    environment:
      - MONGO_DB_USERNAME=${MONGO_APP_USERNAME}
      - MONGO_DB_PWD=${MONGO_APP_PASSWORD}
      - MONGO_URL=mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/myappdb?retryWrites=true&w=majority
    depends_on:
      - mongodb
  mongodb:
    image: mongo
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./docker-compose.init.js:/docker-entrypoint-initdb.d/01-init-app-user.js:ro
  mongo-express:
    image: mongo-express
    restart: always
    ports:
     - 8080:8081
    environment:
     - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USERNAME}
     - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD}
     - ME_CONFIG_MONGODB_SERVER=mongodb
     - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_USERNAME}
     - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_PASSWORD}
    depends_on:
     - "mongodb"
volumes:
  mongo-data:
    driver: local
