apiVersion: v1
kind: Secret
metadata:
  name: mongodb-creds
type: Opaque
stringData:
  # Root creds for mongo init
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: password
  # App-facing keys (separate from root for least privilege)
  MONGO_DB_USERNAME: app_user
  MONGO_DB_PWD: app_password_123
  # Pre-built connection string (simplifies app wiring for the tutorial)
  MONGO_URL: mongodb://app_user:app_password_123@mongodb:27017/myappdb?retryWrites=true&w=majority
  # mongo-express keys
  ME_CONFIG_MONGODB_ADMINUSERNAME: admin
  ME_CONFIG_MONGODB_ADMINPASSWORD: password
  ME_CONFIG_MONGODB_SERVER: mongodb
  ME_CONFIG_BASICAUTH_USERNAME: admin
  ME_CONFIG_BASICAUTH_PASSWORD: password
