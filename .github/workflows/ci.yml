# CI Pipeline - Runs on every push and pull request
name: CI

# When to run this workflow
on:
  push:
    branches: [dev, test, master]    # Run on pushes to these branches
  pull_request:
    branches: [dev, test, master]    # Run on PRs targeting these branches

jobs:
  # Job 1: Lint and Test
  lint-and-test:
    runs-on: ubuntu-latest           # Use Ubuntu runner (free for public repos)

    # Start MongoDB as a service container
    services:
      mongodb:
        image: mongo:6               # MongoDB 6.x
        ports:
          - 27017:27017              # Map port to localhost
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        # Health check to ensure MongoDB is ready before tests run
        options: >-
          --health-cmd "mongosh -u admin -p password --authenticationDatabase admin --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Set environment variable for tests
    env:
      MONGO_URL: mongodb://admin:password@localhost:27017

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1.5: Wait for MongoDB to be ready
      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if nc -z localhost 27017; then
              echo "MongoDB is up!"
              exit 0
            fi
            echo "Waiting for MongoDB... ($i)"
            sleep 1
          done
          echo "MongoDB failed to start"
          exit 1

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'         # Match your Dockerfile (node:22-alpine)
          cache: 'npm'               # Cache npm packages for faster builds
          cache-dependency-path: app/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: ./app
        run: npm ci                  # 'ci' is faster and stricter than 'install'

      # Step 4: Run linter
      - name: Run ESLint
        working-directory: ./app
        run: npm run lint

      # Step 5: Run tests
      - name: Run tests
        working-directory: ./app
        run: npm test

  # Job 2: Build Docker Image
  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test             # Only run if lint-and-test passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx (improved Docker builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image (but don't push it)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                 # Build from repo root (where Dockerfile is)
          push: false                # Don't push to registry, just verify it builds
          tags: developing-with-docker:${{ github.sha }}
          cache-from: type=gha       # Use GitHub Actions cache
          cache-to: type=gha,mode=max
