apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
        - name: mongo-express
          image: mongo-express
          ports:
            - containerPort: 8081
          env:
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: ME_CONFIG_MONGODB_ADMINUSERNAME
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: ME_CONFIG_MONGODB_ADMINPASSWORD
            - name: ME_CONFIG_MONGODB_SERVER
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: ME_CONFIG_MONGODB_SERVER
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: ME_CONFIG_BASICAUTH_USERNAME
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: ME_CONFIG_BASICAUTH_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  node -e "const http=require('http'); const b=Buffer.from(process.env.ME_CONFIG_BASICAUTH_USERNAME+':'
                  +process.env.ME_CONFIG_BASICAUTH_PASSWORD).toString('base64'); const opts={hostname:'127.0.0.1',port:8081,
                  path:'/',method:'GET',headers:{'Authorization':'Basic '+b}}; const req=http.request(opts,res=>{ res.resume();
                  if(res.statusCode===200) process.exit(0); else process.exit(1);}); req.on('error',()=>process.exit(1)); req.end();"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  node -e "const http=require('http'); const b=Buffer.from(process.env.ME_CONFIG_BASICAUTH_USERNAME+':'
                  +process.env.ME_CONFIG_BASICAUTH_PASSWORD).toString('base64'); const opts={hostname:'127.0.0.1',port:8081,
                  path:'/',method:'GET',headers:{'Authorization':'Basic '+b}}; const req=http.request(opts,res=>{ res.resume();
                  if(res.statusCode===200) process.exit(0); else process.exit(1);}); req.on('error',()=>process.exit(1)); req.end();"
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
