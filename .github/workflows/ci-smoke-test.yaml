name: CI — k8s smoke test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-test:
    name: Build, deploy to kind, run smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up kind (Kubernetes in Docker)
        uses: engineerd/setup-kind@v0.5.0
        with:
          version: v0.20.0

      - name: Build Docker image
        run: |
          docker build -t local/my-app:1.0 .

      - name: Load image into kind
        run: |
          kind load docker-image local/my-app:1.0

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/ --wait

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/mongodb --timeout=120s || (kubectl get pods -o wide && kubectl describe pod -l app=mongodb && false)
          kubectl rollout status deployment/my-app --timeout=120s || (kubectl get pods -o wide && kubectl describe pod -l app=my-app && false)
          kubectl rollout status deployment/mongo-express --timeout=120s || (kubectl get pods -o wide && kubectl describe pod -l app=mongo-express && false)

      - name: Make smoke-test executable
        run: chmod +x scripts/smoke-test.sh

      - name: Run smoke tests
        run: |
          ./scripts/smoke-test.sh
