# CI Pipeline - Runs on every push and pull request
name: CI

# When to run this workflow
on:
  push:
    branches: [dev, test, master]    # Run on pushes to these branches
  pull_request:
    branches: [dev, test, master]    # Run on PRs targeting these branches

jobs:
  # Job 1: Lint and Test
  lint-and-test:
    runs-on: ubuntu-latest           # Use Ubuntu runner (free for public repos)

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'         # Match your Dockerfile (node:22-alpine)
          cache: 'npm'               # Cache npm packages for faster builds
          cache-dependency-path: app/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: ./app
        run: npm ci                  # 'ci' is faster and stricter than 'install'

      # Step 4: Run linter
      - name: Run ESLint
        working-directory: ./app
        run: npm run lint

      # Step 5: Run tests
      - name: Run tests
        working-directory: ./app
        run: npm test

  # Job 2: Build Docker Image
  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test             # Only run if lint-and-test passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx (improved Docker builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image (but don't push it)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                 # Build from repo root (where Dockerfile is)
          push: false                # Don't push to registry, just verify it builds
          tags: developing-with-docker:${{ github.sha }}
          cache-from: type=gha       # Use GitHub Actions cache
          cache-to: type=gha,mode=max
